<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Lakshya AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#18202a;
}

header{
  background:#1769aa;
  color:white;
  padding:20px;
  text-align:center;
}

main{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  border-radius:16px;
  box-shadow:0 3px 12px #00000012;
}

textarea{
  width:100%;
  min-height:120px;
  padding:13px;
  border:1px solid #ccd6e0;
  border-radius:12px;
  resize:vertical;
  font-size:16px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  margin:6px 4px 0 0;
  background:#1769aa;
  color:white;
  font-size:15px;
  cursor:pointer;
}

.answer{
  margin-top:18px;
  padding:15px;
  background:#f8fafc;
  border-radius:12px;
  line-height:1.6;
}

.status{
  margin-top:10px;
  color:#555;
  font-size:14px;
}
</style>
</head>

<body>

<header>
  <h1>🤖 Mission Lakshya AI</h1>
  <p>NEET Physics • Chemistry • Biology</p>
</header>

<main>

<div class="card">

<h2>💬 AI Doubt Solver</h2>

<textarea
  id="question"
  placeholder="अपना NEET सवाल लिखें या 🎤 से बोलें..."
></textarea>

<br>

<button onclick="askAI()">🤖 पूछें</button>

<button onclick="startVoice()">🎤 बोलें</button>

<button onclick="stopVoice()">⏹️ रोकें</button>

<button onclick="speakAnswer()">🔊 जवाब सुनें</button>

<div id="status" class="status"></div>

<div id="answer" class="answer">
  यहाँ AI का जवाब दिखाई देगा।
</div>

</div>

</main>

<script>

let lastAnswer = "";

const knowledge = [

{
keys:["newton","न्यूटन","second law","दूसरा नियम"],
answer:"Newton का दूसरा नियम बताता है कि F = ma. यहाँ F बल, m द्रव्यमान और a त्वरण है।"
},

{
keys:["photosynthesis","प्रकाश संश्लेषण","प्रकाशसंश्लेषण"],
answer:"प्रकाश संश्लेषण मुख्यतः chloroplast में होता है। पौधे प्रकाश ऊर्जा की सहायता से भोजन बनाते हैं।"
},

{
keys:["mitochondria","माइटोकॉन्ड्रिया"],
answer:"Mitochondria कोशिका में ऊर्जा उत्पादन से संबंधित organelle है। इसे सामान्यतः cell का powerhouse कहा जाता है।"
},

{
keys:["hemoglobin","हीमोग्लोबिन","blood","रक्त"],
answer:"Hemoglobin लाल रक्त कोशिकाओं में पाया जाने वाला protein है और oxygen transport में महत्वपूर्ण भूमिका निभाता है।"
},

{
keys:["molarity","मोलरिटी"],
answer:"Molarity = solute के moles / solution का volume litre में।"
},

{
keys:["dna","डीएनए"],
answer:"DNA एक genetic material है जो जीवों की hereditary information को store करता है।"
},

{
keys:["rna","आरएनए"],
answer:"RNA कई biological processes में महत्वपूर्ण भूमिका निभाता है, विशेषकर protein synthesis में।"
},

{
keys:["ohm","ओम","resistance","प्रतिरोध"],
answer:"Ohm's law के अनुसार V = IR, जहाँ V voltage, I current और R resistance है।"
},

{
keys:["velocity","वेग"],
answer:"Velocity displacement के परिवर्तन की दर है। यह एक vector quantity है।"
},

{
keys:["acceleration","त्वरण"],
answer:"Acceleration velocity के परिवर्तन की दर है।"
}

];

function askAI(){

const q=document.getElementById("question").value.trim().toLowerCase();

const answerBox=document.getElementById("answer");
const status=document.getElementById("status");

if(!q){
alert("पहले अपना सवाल लिखें।");
return;
}

status.textContent="🤖 जवाब खोज रहा हूँ...";

const found=knowledge.find(item =>
item.keys.some(key=>q.includes(key))
);

if(found){

lastAnswer=found.answer;

answerBox.innerHTML=
"<b>🤖 Mission Lakshya AI:</b><br><br>"+
found.answer;

status.textContent="✅ जवाब तैयार है।";

}else{

lastAnswer=
"इस सवाल का जवाब अभी मेरे Demo Knowledge में उपलब्ध नहीं है। कृपया Physics, Chemistry या Biology से जुड़ा दूसरा सवाल पूछें।";

answerBox.innerHTML=
"<b>🤖 Mission Lakshya AI:</b><br><br>"+
lastAnswer;

status.textContent="ℹ️ Demo AI mode";

}

}

let recognition;

function startVoice(){

if(!("webkitSpeechRecognition" in window) &&
   !("SpeechRecognition" in window)){

alert("आपके browser में voice input उपलब्ध नहीं है।");
return;
}

const SpeechRecognition=
window.SpeechRecognition ||
window.webkitSpeechRecognition;

recognition=new SpeechRecognition();

recognition.lang="hi-IN";
recognition.continuous=false;
recognition.interimResults=false;

recognition.onstart=function(){
document.getElementById("status").textContent=
"🎤 सुन रहा हूँ...";
};

recognition.onresult=function(event){

const text=event.results[0][0].transcript;

document.getElementById("question").value=text;

document.getElementById("status").textContent=
"✅ सवाल मिल गया।";

};

recognition.onerror=function(){
document.getElementById("status").textContent=
"❌ Voice input में समस्या हुई।";
};

recognition.start();

}

function stopVoice(){

if(recognition){
recognition.stop();

document.getElementById("status").textContent=
"⏹️ Voice बंद कर दिया गया।";
}

}

function speakAnswer(){

if(!lastAnswer){

alert("पहले AI से कोई सवाल पूछें।");
return;
}

if(!("speechSynthesis" in window)){

alert("आपके browser में voice output उपलब्ध नहीं है।");
return;
}
}

</script>

</body>
</html>
