<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Lakshya NEET 2027 - AI</title>
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>

<!-- Vercel Speed Insights -->
<script>
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
</script>
<script defer src="/_vercel/speed-insights/script.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#18202a;
}

header{
  background:#1769aa;
  color:white;
  padding:20px;
  text-align:center;
}

header h1{
  margin:0 0 8px;
}

main{
  max-width:750px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:18px;
  border-radius:16px;
  box-shadow:0 3px 12px #00000012;
}

textarea{
  width:100%;
  min-height:120px;
  padding:13px;
  border:1px solid #ccd6e0;
  border-radius:12px;
  resize:vertical;
  font-size:16px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  margin:8px 4px 0 0;
  background:#1769aa;
  color:white;
  font-size:15px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.answer{
  margin-top:18px;
  padding:15px;
  background:#f8fafc;
  border-radius:12px;
  line-height:1.6;
  min-height:80px;
}

.status{
  margin-top:10px;
  color:#555;
  font-size:14px;
}

@media(max-width:600px){
  main{
    padding:10px;
  }

  button{
    width:100%;
    margin-right:0;
  }
}
</style>
</head>

<body>

<header>
  <h1>🤖 Mission Lakshya AI</h1>
  <p>NEET 2027 • Physics • Chemistry • Biology</p>
</header>

<main>

<div class="card">

<h2>💬 AI Doubt Solver</h2>

<textarea
id="question"
placeholder="अपना NEET सवाल लिखें या 🎤 बोलें..."
></textarea>

<br>

<button onclick="askAI()">🤖 सवाल पूछें</button>

<button onclick="startVoice()">🎤 बोलें</button>

<button onclick="stopVoice()">⏹️ रोकें</button>

<button onclick="speakAnswer()">🔊 जवाब सुनें</button>

<div id="status" class="status"></div>

<div id="answer" class="answer">
  👋 नमस्ते! अपना Physics, Chemistry या Biology का सवाल पूछिए।
</div>

</div>

</main>

<script>

let lastAnswer = "";
let recognition = null;


/* =========================
   AI CHAT
========================= */

async function askAI(){

const questionBox=document.getElementById("question");
const answerBox=document.getElementById("answer");
const status=document.getElementById("status");

const question=questionBox.value.trim();

if(!question){
alert("पहले अपना सवाल लिखें या 🎤 से बोलें।");
return;
}

status.textContent="🤖 AI जवाब तैयार कर रहा है...";
answerBox.innerHTML="⏳ कृपया थोड़ा इंतजार करें...";

try{

const response=await fetch("/api/ai",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
question:question
})

});

const data=await response.json();

if(data.answer){

lastAnswer=data.answer;

answerBox.innerHTML=
"<b>🤖 Mission Lakshya AI:</b><br><br>"+
escapeHTML(data.answer).replace(/\n/g,"<br>");

status.textContent="✅ जवाब तैयार है।";

}else{

lastAnswer="AI से कोई जवाब नहीं मिला।";

answerBox.innerHTML=
"<b>❌ समस्या</b><br><br>"+
lastAnswer;

status.textContent="❌ जवाब नहीं मिला।";

}

}catch(error){

console.error(error);

lastAnswer="AI server से connection नहीं हो पाया।";

answerBox.innerHTML=
"<b>❌ AI Connection Error</b><br><br>"+
"Backend अभी connect नहीं है।";

status.textContent="❌ AI server उपलब्ध नहीं है।";

}

}


/* =========================
   VOICE INPUT
========================= */

function startVoice(){

const SpeechRecognition=
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert(
"आपके browser में Voice Input उपलब्ध नहीं है। Chrome browser में कोशिश करें।"
);

return;
}

recognition=new SpeechRecognition();

recognition.lang="hi-IN";

recognition.continuous=false;

recognition.interimResults=false;

recognition.onstart=function(){

document.getElementById("status").textContent=
"🎤 मैं सुन रहा हूँ...";

};

recognition.onresult=function(event){

const text=
event.results[0][0].transcript;

document.getElementById("question").value=text;

document.getElementById("status").textContent=
"✅ आपकी आवाज़ मिल गई। अब 'सवाल पूछें' दबाएँ।";

};

recognition.onerror=function(event){

console.log(event);

document.getElementById("status").textContent=
"❌ Voice input में समस्या हुई।";

};

recognition.onend=function(){

console.log("Voice recognition stopped");

};

recognition.start();

}


/* =========================
   STOP VOICE
========================= */

function stopVoice(){

if(recognition){

recognition.stop();

document.getElementById("status").textContent=
"⏹️ Voice बंद कर दिया गया।";

}

}


/* =========================
   VOICE ANSWER
========================= */

function speakAnswer(){

if(!lastAnswer){

alert("पहले AI से कोई सवाल पूछें।");

return;
}

if(!("speechSynthesis" in window)){

alert(
"आपके browser में Voice Answer उपलब्ध नहीं है।"
);

return;
}

window.speechSynthesis.cancel();

const speech=
new SpeechSynthesisUtterance(lastAnswer);

speech.lang="hi-IN";

speech.rate=0.9;

speech.pitch=1;

window.speechSynthesis.speak(speech);

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text){

const div=document.createElement("div");

div.textContent=text;

return div.innerHTML;

}

</script>

</body>
</html>
